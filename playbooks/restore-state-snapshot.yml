---
- name: Explain the application snapshot boundary
  hosts: xian_nodes
  gather_facts: false
  tasks:
    - name: Refuse application-only archives as node bootstrap
      ansible.builtin.fail:
        msg: >-
          Application-only xian-state-snapshot archives are offline data APIs,
          not complete node bootstrap or a restore followed by automatic redeploy.
          Use ordinary replay or a verified full-node-store snapshot with
          restore-network-snapshot.yml. Preserve this node's keys and signing state.
