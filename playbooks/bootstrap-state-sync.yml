---
- name: Explain supported Xian bootstrap methods
  hosts: xian_nodes
  gather_facts: false
  tasks:
    - name: Refuse unsupported P2P application state sync
      ansible.builtin.fail:
        msg: >-
          P2P application state sync is disabled with unmodified upstream CometBFT.
          Use ordinary replay or a verified full-node-store snapshot with
          restore-network-snapshot.yml.
