---
- name: Smoke check a Xian deployment
  hosts: xian_nodes
  become: true
  roles:
    - xian_profile
  tasks:
    - name: Check the installed private transport requirement
      ansible.builtin.include_role:
        name: xian_runtime
        tasks_from: check_private_marker

    - name: Verify the running private validator transport
      ansible.builtin.include_role:
        name: xian_runtime
        tasks_from: private_transport
      vars:
        xian_private_check_mode: running
      when: xian_private_validator_transport is defined

    - name: Show container status
      ansible.builtin.shell: >-
        docker compose
        -p {{ xian_project_name | quote }}
        -f {{ xian_runtime_dir | quote }}/docker-compose.yml
        {% if xian_monitoring_enabled | bool %}
        -f {{ xian_runtime_dir | quote }}/docker-compose.monitoring.yml
        {% endif %}
        ps
      register: xian_smoke_ps
      changed_when: false

    - name: Check node RPC status
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ xian_rpc_port }}/status"
        return_content: true
      register: xian_rpc_status
      changed_when: false
      when: xian_private_validator_transport is not defined

    - name: Probe RPC in the private validator namespace
      ansible.builtin.include_role:
        name: xian_runtime
        tasks_from: probe_private_rpc
      when: xian_private_validator_transport is defined

    - name: Require a healthy private RPC endpoint
      ansible.builtin.set_fact:
        xian_rpc_status: "{{ xian_private_rpc_status }}"
      failed_when: xian_private_rpc_status.status != 200
      when: xian_private_validator_transport is defined

    - name: Check Xian metrics endpoint
      ansible.builtin.uri:
        url: "{{ xian_app_metrics_probe_url }}"
        return_content: false
      register: xian_metrics_status
      changed_when: false
      when: xian_metrics_enabled | bool

    - name: Check dashboard
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ xian_dashboard_port }}/"
        return_content: false
      register: xian_dashboard_status
      changed_when: false
      when: xian_dashboard_enabled | bool

    - name: Check Prometheus
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ xian_prometheus_port }}/-/ready"
        return_content: false
      register: xian_prometheus_status
      changed_when: false
      when: xian_monitoring_enabled | bool

    - name: Print smoke summary
      ansible.builtin.debug:
        msg:
          - "{{ xian_smoke_ps.stdout_lines }}"
          - "rpc_height={{ xian_rpc_status.json.result.sync_info.latest_block_height }}"
          - "rpc_catching_up={{ xian_rpc_status.json.result.sync_info.catching_up }}"
          - "metrics_ok={{ (xian_metrics_status.status if xian_metrics_enabled else 'disabled') }}"
          - "dashboard_ok={{ (xian_dashboard_status.status if xian_dashboard_enabled else 'disabled') }}"
          - "prometheus_ok={{ (xian_prometheus_status.status if xian_monitoring_enabled else 'disabled') }}"
