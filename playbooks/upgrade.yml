---
- name: Roll out a Xian runtime update
  hosts: xian_nodes
  become: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - xian_profile
    - role: xian_runtime
      vars:
        xian_runtime_action: deploy
  post_tasks:
    - name: Wait until the upgraded node is synced before the next host
      ansible.builtin.include_role:
        name: xian_runtime
        tasks_from: wait_for_rpc_sync
