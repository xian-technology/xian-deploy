---
- name: Validate profile network snapshot
  ansible.builtin.assert:
    that:
      - xian_snapshot_url | length > 0
    fail_msg: The node profile has no snapshot_url to restore from.

- name: Validate network snapshot signing keys
  ansible.builtin.assert:
    that:
      - xian_snapshot_signing_keys | length > 0
    fail_msg: >-
      Restoring a network snapshot requires trusted snapshot_signing_keys in
      the node profile so the snapshot manifest is verified.

- name: Resolve expected snapshot chain id
  ansible.builtin.set_fact:
    xian_network_snapshot_expected_chain_id: "{{ xian_snapshot_expected_chain_id | default(xian_effective_chain_id, true) }}"
