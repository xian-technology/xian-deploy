---
- name: Validate node home archive path
  ansible.builtin.assert:
    that:
      - xian_node_home_archive is string
      - xian_node_home_archive | length > 0
    fail_msg: xian_node_home_archive must point to a local tar or tar.gz archive

- name: Check validator signing state before touching the home
  ansible.builtin.import_tasks: check_signing_state.yml

- name: Inspect the managed runtime configuration
  ansible.builtin.stat:
    path: "{{ xian_runtime_dir }}/docker-compose.yml"
  register: xian_node_home_runtime_config

- name: Stop a managed runtime before replacing its home
  ansible.builtin.include_role:
    name: xian_runtime
  vars:
    xian_runtime_action: stop
  when: xian_node_home_runtime_config.stat.exists

# A height-zero validator may have signed while the stop command was running.
- name: Recheck signing state after the managed runtime stopped
  ansible.builtin.import_tasks: check_signing_state.yml
  when: xian_node_home_runtime_config.stat.exists

- name: Remove existing node home
  ansible.builtin.file:
    path: "{{ xian_cometbft_home }}"
    state: absent
  when: xian_node_home_replace | bool

- name: Create node home directory
  ansible.builtin.file:
    path: "{{ xian_cometbft_home }}"
    state: directory
    mode: "0755"

- name: Upload and extract node home archive
  ansible.builtin.unarchive:
    src: "{{ xian_node_home_archive }}"
    dest: "{{ xian_cometbft_home }}"
    remote_src: false

