name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xian-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: xian-deploy

      - name: Checkout canonical runtime and monitoring assets
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-stack
          ref: 44e329927fb8f96d85b225f99d349cc76e82aba2
          path: xian-stack

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Report canonical guard source
        run: |
          git -C ../xian-stack rev-parse HEAD
          python3 -c "import hashlib,pathlib; p=pathlib.Path('../xian-stack/scripts/node_store_runtime_guard.py'); print(hashlib.sha256(p.read_bytes()).hexdigest(),p)"

      - name: Build and pin the canonical monitoring test bundle
        run: |
          python3 ../xian-stack/scripts/package_monitoring.py "$RUNNER_TEMP/xian-monitoring"
          echo "XIAN_MONITORING_TEST_BUNDLE=$RUNNER_TEMP/xian-monitoring/xian-monitoring.tar" >> "$GITHUB_ENV"

      - name: Lint playbooks
        run: make lint

      - name: Validate playbooks
        run: make validate

      - name: Exercise the private validator transport on Linux
        run: |
          docker build -t xian-wg-test -f - ../xian-stack/docker/s6-overlay <<'DOCKERFILE'
          FROM alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
          RUN apk add --no-cache iproute2 wireguard-tools python3
          COPY usr/local/bin/xian-comet-rpc-address /usr/local/bin/
          DOCKERFILE
          test "$(docker run --rm --network none -e XIAN_PRIVATE_VALIDATOR_RPC=1 xian-wg-test xian-comet-rpc-address)" = tcp://127.0.0.1:26657
          uvx --from ansible-core python tests/check_private_wireguard.py --image xian-wg-test
